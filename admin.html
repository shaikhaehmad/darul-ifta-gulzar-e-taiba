<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darul Ifta - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #0b5e2e; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn { background-color: #0b5e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #084823; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .btn-delete { background-color: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #0b5e2e; text-decoration: none; font-weight: bold; font-size: 14px; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<!-- Password Protection Box -->
<div id="login-screen" class="login-box">
    <h2>🔐 Admin Login</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Secret PIN Darj Karein</p>
    <div class="form-group">
        <label>PIN (786):</label>
        <input type="password" id="admin-pass" placeholder="PIN daalein">
    </div>
    <button class="btn" onclick="checkPassword()">Login Karein</button>
</div>

<!-- Main Admin Panel -->
<div id="admin-panel" class="container">
    <a href="index.html" class="back-link">⬅️ Website par Wapas Jayein</a>
    <h2>🔐 Darul Ifta Admin Panel</h2>
    
    <div class="form-group">
        <label>Kitab ka Naam (Urdu / Hindi / Gujarati / English):</label>
        <input type="text" id="file-title" placeholder="Jaise: Namaz ka Tareeqa ya کبر پر فاتحہ">
    </div>

    <div class="form-group">
        <label>PDF File Select Karein:</label>
        <input type="file" id="file-input" accept="application/pdf">
    </div>

    <button class="btn" onclick="uploadBook()">🚀 Kitab Add Karein</button>

    <div id="status"></div>

    <hr style="margin: 20px 0;">

    <h3>📁 Maujuda Kitabein (Yahan se hatayein)</h3>
    <div id="admin-file-list" style="margin-top: 15px;">
        <!-- List yahan aayegi -->
    </div>
</div>

<script>
    const SECRET_PIN = "2013";

    function checkPassword() {
        const enteredPass = document.getElementById('admin-pass').value.trim();
        if (enteredPass === SECRET_PIN) {
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('admin-panel').style.display = "block";
            loadAdminFiles();
        } else {
            alert("Galat PIN!");
            document.getElementById('admin-pass').value = "";
        }
    }

    function loadAdminFiles() {
        const adminList = document.getElementById('admin-file-list');
        let files = JSON.parse(localStorage.getItem('darul_ifta_books')) || [];
        
        adminList.innerHTML = "";
        if (files.length === 0) {
            adminList.innerHTML = "<p style='color: #64748b; font-size: 14px;'>Abhi koi kitab nahi hai.</p>";
            return;
        }

        files.slice().reverse().forEach((file, index) => {
            const realIndex = files.length - 1 - index;
            adminList.innerHTML += `
                <div class="file-item">
                    <div>
                        <strong>${file.title}</strong>
                    </div>
                    <button class="btn-delete" onclick="deleteFile(${realIndex})">Hatayein</button>
                </div>
            `;
        });
    }

    function uploadBook() {
        const title = document.getElementById('file-title').value.trim();
        const fileInput = document.getElementById('file-input').files[0];
        const statusEl = document.getElementById('status');

        if (!title || !fileInput) {
            alert("Kripya Kitab ka Naam aur PDF File dono select karein!");
            return;
        }

        statusEl.style.color = "#2563eb";
        statusEl.innerText = "Upload ho raha hai, kripya intezaar karein...";

        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = function () {
            const fileUrl = reader.result; 
            
            let files = JSON.parse(localStorage.getItem('darul_ifta_books')) || [];
            files.push({ title: title, url: fileUrl });
            
            try {
                localStorage.setItem('darul_ifta_books', JSON.stringify(files));
                statusEl.style.color = "#16a34a";
                statusEl.innerText = "✅ Kitab safalta-purvak add ho gayi!";
                
                document.getElementById('file-title').value = "";
                document.getElementById('file-input').value = "";
                loadAdminFiles();
            } catch (e) {
                statusEl.style.color = "#dc2626";
                statusEl.innerText = "❌ Error: Storage full ho rahi hai! Choti size ki PDF dalein.";
            }
        };
    }

    function deleteFile(index) {
        if (confirm("Kya aap is kitab ko hatana chahte hain?")) {
            let files = JSON.parse(localStorage.getItem('darul_ifta_books')) || [];
            files.splice(index, 1);
            localStorage.setItem('darul_ifta_books', JSON.stringify(files));
            loadAdminFiles();
        }
    }
</script>

</body>
</html>
