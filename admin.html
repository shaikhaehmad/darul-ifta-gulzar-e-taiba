<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darul Ifta - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0b5e2e; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn { background-color: #0b5e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #084823; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .btn-delete { background-color: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #0b5e2e; text-decoration: none; font-weight: bold; font-size: 14px; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">⬅️ Website par Wapas Jayein</a>
    <h2>🔐 Darul Ifta Admin Panel</h2>
    
    <div class="form-group">
        <label>Content Type:</label>
        <select id="content-type">
            <option value="PDF">PDF Kitab</option>
            <option value="Video">Video Bayan</option>
        </select>
    </div>

    <div class="form-group">
        <label>Title / Naam:</label>
        <input type="text" id="file-title" placeholder="Jaise: Namaz ka Tareeqa">
    </div>

    <div class="form-group">
        <label>File Select Karein (PDF / Video):</label>
        <input type="file" id="file-input">
    </div>

    <button class="btn" onclick="uploadFileLocally()">🚀 Website par Upload Karein</button>

    <div id="status"></div>

    <hr style="margin: 20px 0;">

    <h3>📁 Maujuda Files (Hatayein)</h3>
    <div id="admin-file-list" style="margin-top: 15px;">
        <!-- List yahan aayegi -->
    </div>
</div>

<script>
    function loadAdminFiles() {
        const adminList = document.getElementById('admin-file-list');
        let files = JSON.parse(localStorage.getItem('darul_ifta_files')) || [];
        
        adminList.innerHTML = "";
        if (files.length === 0) {
            adminList.innerHTML = "<p style='color: #64748b; font-size: 14px;'>Koi file nahi hai.</p>";
            return;
        }

        files.forEach((file, index) => {
            adminList.innerHTML += `
                <div class="file-item">
                    <div>
                        <strong>${file.title}</strong> (${file.type})
                    </div>
                    <button class="btn-delete" onclick="deleteFile(${index})">Hatain</button>
                </div>
            `;
        });
    }

    function uploadFileLocally() {
        const title = document.getElementById('file-title').value.trim();
        const type = document.getElementById('content-type').value;
        const fileInput = document.getElementById('file-input').files[0];
        const statusEl = document.getElementById('status');

        if (!title || !fileInput) {
            alert("Kripya Title aur File dono select karein!");
            return;
        }

        statusEl.style.color = "#2563eb";
        statusEl.innerText = "Upload ho raha hai, thoda intezaar karein...";

        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = function () {
            const fileUrl = reader.result; 
            
            let files = JSON.parse(localStorage.getItem('darul_ifta_files')) || [];
            files.push({ title: title, type: type, url: fileUrl });
            localStorage.setItem('darul_ifta_files', JSON.stringify(files));

            statusEl.style.color = "#16a34a";
            statusEl.innerText = "✅ File safalta-purvak add ho gayi! Ab aap website par dekh sakte hain.";
            
            document.getElementById('file-title').value = "";
            document.getElementById('file-input').value = "";
            loadAdminFiles();
        };
    }

    function deleteFile(index) {
        // Yahan 'confirmkri' ko theek karke standard 'confirm' kar diya hai
        if (confirm("Kya aap is file ko hatana chahte hain?")) {
            let files = JSON.parse(localStorage.getItem('darul_ifta_files')) || [];
            files.splice(index, 1);
            localStorage.setItem('darul_ifta_files', JSON.stringify(files));
            loadAdminFiles();
        }
    }

    window.onload = loadAdminFiles;
</script>

</body>
</html>
