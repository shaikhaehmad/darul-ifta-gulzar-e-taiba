<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darul Ifta Gulzar-e-Taiba</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #0b5329;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header nav a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .item-card {
            background: white;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-title {
            font-size: 18px;
            font-weight: bold;
            color: #0b5329;
        }
        .item-type {
            font-size: 12px;
            background: #e0f2f1;
            color: #00695c;
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }
        .btn-view {
            background-color: #0b5329;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-view:hover {
            background-color: #083d1e;
        }
        .no-data {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Darul Ifta Gulzar-e-Taiba</h1>
    <p>Tamam PDF Kitabein aur Bayanat</p>
    <nav>
        <a href="admin.html">🔐 Admin Panel (Upload Karein)</a>
    </nav>
</header>

<div class="container">
    <h2>Sabhi Upload ki gayi Files</h2>
    <div id="itemList">
        <p class="no-data">Loading ho raha hai...</p>
    </div>
</div>

<script>
    async function loadContent() {
        const user = "shaikhaehmad";
        const repo = "darul-ifta-gulzar-e-taiba";
        const listContainer = document.getElementById('itemList');

        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`);
            if (!res.ok) throw new Error("Data nahi mila");

            const fileData = await res.json();
            // UTF-8 safe decoding taaki Hindi/Urdu text theek se dikhe
            const jsonString = decodeURIComponent(escape(window.atob(fileData.content)));
            const items = JSON.parse(jsonString);

            if (items.length === 0) {
                listContainer.innerHTML = '<p class="no-data">Abhi koi file upload nahi ki gayi hai.</p>';
                return;
            }

            let html = '';
            // Nayi upload ki gayi file sabse upar dikhegi (reverse order)
            items.reverse().forEach(item => {
                let badgeText = item.type === 'pdf' ? 'PDF Kitab' : 'Video Bayan';
                let fileLink = item.type === 'pdf' ? `https://raw.githubusercontent.com/${user}/${repo}/main/${item.url}` : item.url;
                
                html += `
                    <div class="item-card">
                        <div>
                            <span class="item-title">${item.title}</span>
                            <span class="item-type">${badgeText}</span>
                        </div>
                        <a href="${fileLink}" target="_blank" class="btn-view">Dekhein / Padhein</a>
                    </div>
                `;
            });

            listContainer.innerHTML = html;

        } catch (err) {
            listContainer.innerHTML = '<p class="no-data">Abhi tak koi data available nahi hai ya file load nahi ho payi.</p>';
        }
    }

    loadContent();
</script>

</body>
</html>
