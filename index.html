<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darul Ifta Gulzar-e-Taiba</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 40px; }

        /* Naya Home Page Color Theme */
        .header { background: linear-gradient(135deg, #0f5132, #198754); color: #ffffff; padding: 22px 15px; text-align: center; }
        .header h1 { font-size: 22px; margin-bottom: 5px; letter-spacing: 0.3px; }
        .header p { font-size: 13px; opacity: 0.95; margin-bottom: 14px; }

        .social-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 780px; margin: 0 auto; }
        .s-link { text-decoration: none; color: #ffffff; font-size: 12px; font-weight: bold; padding: 7px 11px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.22); }
        .s-tg { background-color: #0284c7; }
        .s-wa { background-color: #15803d; }
        .s-ig { background-color: #be185d; }
        .s-fb { background-color: #1d4ed8; }
        .s-yt { background-color: #b91c1c; }

        .nav-container { display: flex; gap: 7px; padding: 14px 15px 6px; max-width: 720px; margin: 0 auto; overflow-x: auto; }
        .nav-tab { flex: 1; padding: 10px 8px; text-align: center; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .nav-tab.active { background-color: #0f5132; color: #ffffff; box-shadow: 0 2px 6px rgba(15,81,50,0.25); }
        .nav-tab.inactive { background-color: #e2e8f0; color: #334155; }

        .container { max-width: 720px; margin: 0 auto; padding: 8px 15px 20px; }

        .filter-box { background-color: #ffffff; padding: 13px; border-radius: 10px; box-shadow: 0 2px 6px rgba(15,23,42,0.06); border: 1px solid #e2e8f0; margin-bottom: 16px; }
        #search-input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; margin-bottom: 10px; background-color: #f8fafc; color: #0f172a; }
        .lang-filters { display: flex; flex-wrap: wrap; gap: 7px; }
        .lang-btn { border: 1px solid #cbd5e1; background-color: #f1f5f9; color: #334155; padding: 7px 13px; border-radius: 7px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background-color: #0f5132; color: #ffffff; border-color: #0f5132; }

        .lang-section { margin-bottom: 24px; }
        .lang-heading { font-size: 17px; color: #0f5132; border-bottom: 2px solid #0f5132; padding-bottom: 6px; margin-bottom: 12px; }

        .card { background-color: #ffffff; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(15,23,42,0.05); border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .rtl-card { direction: rtl; text-align: right; }
        .card-info h3 { font-size: 16px; margin-bottom: 6px; color: #0f172a; }

        .badge-pdf { font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: bold; background-color: #e0f2fe; color: #0369a1; display: inline-block; }
        .badge-tele { font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: bold; background-color: #fef3c7; color: #92400e; display: inline-block; }
        .badge-video { font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: bold; background-color: #fee2e2; color: #991b1b; display: inline-block; }

        .card-actions { display: flex; flex-direction: column; gap: 6px; }
        .btn-view { background-color: #0f5132; color: #ffffff; text-decoration: none; padding: 9px 14px; border-radius: 7px; font-size: 13px; font-weight: bold; text-align: center; white-space: nowrap; }
        .btn-view:hover { background-color: #146c43; }

        .sawaal-box { background-color: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(15,23,42,0.06); border: 1px solid #e2e8f0; margin-top: 10px; }
        .sawaal-box h3 { color: #0f5132; margin-bottom: 15px; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #1e293b; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; background-color: #f8fafc; }
        .btn-submit { background-color: #0f5132; color: #ffffff; border: none; padding: 11px; width: 100%; border-radius: 7px; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Darul Ifta Gulzar-e-Taiba</h1>
        <p>Gujarati • Hindi • Urdu — PDF, Telegram & Video Bayanat</p>
        <div class="social-bar" id="header-socials"></div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-container">
        <div id="tab-pdf" class="nav-tab active" onclick="switchSection('pdf')">PDF Kitabein</div>
        <div id="tab-telegram" class="nav-tab inactive" onclick="switchSection('telegram')">Telegram</div>
        <div id="tab-video" class="nav-tab inactive" onclick="switchSection('video')">Video Bayan</div>
        <div id="tab-sawaal" class="nav-tab inactive" onclick="switchSection('sawaal')">Fatwa / Sawaal</div>
    </div>

    <div class="container">
        <!-- Search & Language Filter -->
        <div id="filter-panel" class="filter-box">
            <input type="text" id="search-input" placeholder="Gujarati, Hindi, Urdu mein search karein..." oninput="handleSearch(this.value)">
            <div class="lang-filters">
                <button type="button" class="lang-btn active" data-lang="all" onclick="setLangFilter('all')">Sabhi Bhasha</button>
                <button type="button" class="lang-btn" data-lang="gu" onclick="setLangFilter('gu')">ગુજરાતી</button>
                <button type="button" class="lang-btn" data-lang="hi" onclick="setLangFilter('hi')">हिन्दी</button>
                <button type="button" class="lang-btn" data-lang="ur" onclick="setLangFilter('ur')">اردو</button>
            </div>
        </div>

        <!-- Content List -->
        <div id="content-list"></div>

        <!-- Sawaal / Fatwa Section -->
        <div id="section-sawaal" style="display: none;">
            <div class="sawaal-box">
                <h3>دارالافتاء گلزار طیبہ</h3>
                <p style="font-size: 14px; color: #475569; margin-bottom: 15px; font-weight: bold;">--- جدید سوال / مسئلہ ---</p>

                <div class="form-group">
                    <label>Naam:</label>
                    <input type="text" id="s-name" placeholder="Apna naam likhein">
                </div>
                <div class="form-group">
                    <label>Mobile:</label>
                    <input type="tel" id="s-phone" placeholder="Mobile number">
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" id="s-address" placeholder="Apna address likhein (jaise: Malvan)">
                </div>
                <div class="form-group">
                    <label>Sawal / Masla:</label>
                    <textarea id="s-text" rows="4" placeholder="Apna sawaal tafseel se likhein..."></textarea>
                </div>
                <p style="font-size: 11px; color: #64748b; margin-bottom: 12px; font-style: italic;">(Note: Agar koi photo/document hai, toh kripya is message ke sath ya alag se WhatsApp par bhej dein.)</p>

                <button class="btn-submit" onclick="sendWhatsAppSawaal()">WhatsApp par Sawaal Bhejein</button>
            </div>
        </div>
    </div>

    <script>
        const SOCIAL_LINKS = [
            { label: "Telegram Channel", url: "https://t.me/daruliftagulzaretaiba", cls: "s-tg" },
            { label: "WhatsApp Channel", url: "https://whatsapp.com/channel/0029VaAYgoVA2pL4X43ctJ12", cls: "s-wa" },
            { label: "Instagram (Darul Ifta)", url: "https://www.instagram.com/daruliftagulzaretaiba.official?knvt=eXVyMjBkbzczenZs", cls: "s-ig" },
            { label: "Instagram (Shaikh Aehmad)", url: "https://www.instagram.com/shaikh_aehmad__786?avpt=aThsbjFycHlrdmZw", cls: "s-ig" },
            { label: "Facebook Page 1", url: "https://www.facebook.com/share/1J9RGN3SPX/", cls: "s-fb" },
            { label: "Facebook Page 2", url: "https://www.facebook.com/share/1BtsykWUjo/", cls: "s-fb" },
            { label: "YouTube Channel", url: "https://youtube.com/@shaikhaehmad-786?si=8sO1wtw1BbE-KmSl", cls: "s-yt" }
        ];

        // Fallback data agar Firestore mein abhi data na ho ya offline ho
        const FALLBACK_DATA = [
            { lang: 'hi', type: 'pdf', title: 'अनवारे एहले बैत', url: 'https://drive.google.com/file/d/1h29PxSGpErb53Sx1KHnOb3myUhlVARuS/view?usp=drivesdk' },
            { lang: 'hi', type: 'pdf', title: 'मोहब्बते रसुल', url: 'https://drive.google.com/file/d/1Tj7B4CATDBEVAOi0cROV2KjBJqMDZh7F/view?usp=drivesdk' },
            { lang: 'ur', type: 'pdf', title: 'محبت رسول', url: 'https://drive.google.com/file/d/1VJJ8eF_ubul2JLSpo21GPLRvWPLKuXHx/view?usp=drivesdk' },
            { lang: 'gu', type: 'pdf', title: 'મોહોબ્બતે રસુલ', url: 'https://drive.google.com/file/d/1iCPegplJiuZTKMdFaY18M0vMdlSROawT/view?usp=drivesdk' },
            { lang: 'gu', type: 'telegram', title: 'બાળકોના (200) ઇસ્લામી નામ', url: 'https://t.me/daruliftagulzaretaiba/3' }
        ];

        const LANG_TITLES = {
            gu: "ગુજરાતી Kitabein / Bayanat",
            hi: "हिन्दी Kitabein / Bayanat",
            ur: "اردو Kitabein / Bayanat"
        };

        let activeItems = FALLBACK_DATA.slice();
        let currentTab = "pdf";
        let currentLang = "all";
        let searchQuery = "";

        // Firestore se live items set karne ka helper
        window.setLiveWebsiteItems = function(items) {
            if (Array.isArray(items) && items.length > 0) {
                activeItems = items;
            } else {
                activeItems = FALLBACK_DATA.slice();
            }
            if (currentTab !== "sawaal") {
                loadFilteredContent();
            }
        };

        function renderSocialLinks() {
            const markup = SOCIAL_LINKS.map(
                s => `<a href="${escapeAttr(s.url)}" target="_blank" rel="noopener noreferrer" class="s-link ${s.cls}">${escapeHTML(s.label)}</a>`
            ).join("");
            document.getElementById("header-socials").innerHTML = markup;
        }

        function switchSection(sectionName) {
            currentTab = sectionName;
            ['pdf', 'telegram', 'video', 'sawaal'].forEach(sec => {
                const tabEl = document.getElementById('tab-' + sec);
                tabEl.className = (sec === sectionName) ? "nav-tab active" : "nav-tab inactive";
            });

            const contentList = document.getElementById('content-list');
            const sawaalSec = document.getElementById('section-sawaal');
            const filterPanel = document.getElementById('filter-panel');

            if (sectionName === 'sawaal') {
                contentList.style.display = 'none';
                filterPanel.style.display = 'none';
                sawaalSec.style.display = 'block';
            } else {
                sawaalSec.style.display = 'none';
                filterPanel.style.display = 'block';
                contentList.style.display = 'block';
                loadFilteredContent();
            }
        }

        function setLangFilter(langCode) {
            currentLang = langCode;
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === langCode);
            });
            if (currentTab !== "sawaal") {
                loadFilteredContent();
            }
        }

        function handleSearch(val) {
            searchQuery = val || "";
            if (currentTab !== "sawaal") {
                loadFilteredContent();
            }
        }

        function normalizeStr(s) {
            return (s || "").toLowerCase().normalize("NFKC").trim();
        }

        function matchesQuery(item) {
            if (!searchQuery.trim()) return true;
            const q = normalizeStr(searchQuery);
            const hay = [item.title, item.lang, item.type].map(normalizeStr).join(" ");
            return hay.includes(q);
        }

        function escapeHTML(str) {
            return (str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeAttr(str) {
            return escapeHTML(str);
        }

        function buildCardHTML(item) {
            let badgeHTML = '';
            let btnText = 'Dekhein';

            if (item.type === 'pdf') {
                badgeHTML = '<span class="badge-pdf">Google Drive PDF</span>';
                btnText = 'PDF Padhein';
            } else if (item.type === 'telegram') {
                badgeHTML = '<span class="badge-tele">Telegram Link</span>';
                btnText = 'Kholein';
            } else if (item.type === 'video') {
                badgeHTML = '<span class="badge-video">Video Bayan</span>';
                btnText = 'Video Dekhein';
            }

            const rtlClass = item.lang === 'ur' ? 'rtl-card' : '';
            const safeUrl = escapeAttr(item.url);
            const safeTitle = escapeHTML(item.title);

            return `
                <div class="card ${rtlClass}">
                    <div class="card-info">
                        <h3>${safeTitle}</h3>
                        <div style="margin-top: 4px;">${badgeHTML}</div>
                    </div>
                    <div class="card-actions">
                        <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="btn-view">${btnText}</a>
                    </div>
                </div>
            `;
        }

        function loadFilteredContent() {
            const listContainer = document.getElementById('content-list');
            const byType = activeItems.filter(item => item.type === currentTab);
            const langsToRender = currentLang === "all" ? ["gu", "hi", "ur"] : [currentLang];

            let htmlOut = "";
            let totalFound = 0;

            langsToRender.forEach(langCode => {
                const items = byType
                    .filter(item => (item.lang || "hi") === langCode && matchesQuery(item))
                    .slice()
                    .reverse();

                if (items.length === 0) return;
                totalFound += items.length;

                htmlOut += `<div class="lang-section">`;
                htmlOut += `<h2 class="lang-heading">${LANG_TITLES[langCode]}</h2>`;
                htmlOut += items.map(buildCardHTML).join("");
                htmlOut += `</div>`;
            });

            if (totalFound === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: #64748b; margin-top: 32px;">Is section ya bhasha mein abhi koi item nahi mila.</div>`;
                return;
            }

            listContainer.innerHTML = htmlOut;
        }

        function sendWhatsAppSawaal() {
            const name = document.getElementById('s-name').value.trim();
            const phone = document.getElementById('s-phone').value.trim();
            const address = document.getElementById('s-address').value.trim();
            const text = document.getElementById('s-text').value.trim();

            if (!name || !text) {
                alert("Kripya apna naam aur sawaal zaroor likhein!");
                return;
            }

            const muftiWhatsAppNumber = "918758647929";
            const message = `*دارالافتاء گلزار طیبہ*%0A*--- جدید سوال / مسئلہ ---*%0A%0A👤 *Naam:* ${encodeURIComponent(name)}%0A📱 *Mobile:* ${encodeURIComponent(phone)}%0A🏠 *Address:* ${encodeURIComponent(address)}%0A%0A❓ *Sawal / Masla:*%0A${encodeURIComponent(text)}%0A%0A📎 *(Note: Agar koi photo/document hai, toh kripya is message ke sath ya alag se WhatsApp par bhej dein.)*`;
            const whatsappUrl = `https://wa.me/${muftiWhatsAppNumber}?text=${message}`;

            window.open(whatsappUrl, '_blank');
        }

        window.onload = function() {
            renderSocialLinks();
            switchSection('pdf');
        };
    </script>

    <script type="module">
        import { db, auth } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

        console.log("Firebase connected:", db, auth);

        async function loadItemsFromFirestore() {
            try {
                const snap = await getDocs(collection(db, "items"));
                const docsData = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data && data.title && data.url && data.type) {
                        docsData.push({
                            id: doc.id,
                            lang: data.lang || "hi",
                            type: data.type,
                            title: data.title,
                            url: data.url
                        });
                    }
                });
                if (docsData.length > 0 && typeof window.setLiveWebsiteItems === "function") {
                    window.setLiveWebsiteItems(docsData);
                }
            } catch (err) {
                console.warn("Firestore se data load nahi ho paya, fallback data dikh raha hai:", err);
            }
        }

        loadItemsFromFirestore();
    </script>
</body>
</html>
